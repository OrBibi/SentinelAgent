openapi: 3.0.3
info:
  title: Demo Store API
  version: 1.0.0
servers:
  - url: http://localhost:9000/api
security:
  - bearerAuth: []
paths:
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getUser
      summary: Fetch a user profile owned by the caller
      responses:
        "200":
          description: OK
    patch:
      operationId: updateUser
      summary: Update the caller's display name or email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Fetch an order belonging to the caller
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /users/{userId}/orders:
    get:
      operationId: listUserOrders
      summary: List orders owned by the caller
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /orders:
    get:
      operationId: listOrders
      summary: List the caller's orders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [open, shipped, cancelled]
      responses:
        "200":
          description: OK
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  type: string
                qty:
                  type: integer
                note:
                  type: string
      responses:
        "201":
          description: Created
  /search:
    post:
      operationId: searchCatalog
      summary: Search the public catalog with a natural-language query
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        "200":
          description: OK
  /comments:
    post:
      operationId: addComment
      summary: Add a delivery comment to an order owned by the caller
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                text:
                  type: string
      responses:
        "201":
          description: Created
  /payments:
    get:
      operationId: listPayments
      summary: List the caller's payments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      operationId: createPayment
      summary: Pay for an order owned by the caller
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                amount:
                  type: number
                currency:
                  type: string
      responses:
        "201":
          description: Created
  /payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Fetch one payment owned by the caller
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /addresses:
    get:
      operationId: listAddresses
      summary: List the caller's shipping addresses
      responses:
        "200":
          description: OK
    post:
      operationId: createAddress
      summary: Add a shipping address for the caller
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                line1:
                  type: string
                city:
                  type: string
                postal_code:
                  type: string
      responses:
        "201":
          description: Created
  /tickets:
    get:
      operationId: listTickets
      summary: List the caller's support tickets
      responses:
        "200":
          description: OK
    post:
      operationId: createTicket
      summary: Open a support ticket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: Created
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: Fetch one support ticket owned by the caller
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /reviews:
    post:
      operationId: createReview
      summary: Review a product the caller bought
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                rating:
                  type: integer
                title:
                  type: string
      responses:
        "201":
          description: Created
  /cart:
    get:
      operationId: getCart
      summary: Read the caller's cart
      responses:
        "200":
          description: OK
    post:
      operationId: addCartItem
      summary: Add an item to the caller's cart
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  type: string
                qty:
                  type: integer
      responses:
        "201":
          description: Created
  /notifications:
    get:
      operationId: listNotifications
      summary: List the caller's notifications
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
  /files:
    get:
      operationId: downloadFile
      summary: Download a public document by name
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        email:
          type: string
